<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fund &amp; Loan System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: fixed navy sidebar + scrolling work area; summary tiles first, then alerts, then working tables */
:root{
  --bg:#f4f4f1; --surface:#ffffff; --surface2:#f8f8fb; --ink:#1a1a2e; --muted:#5c5c6e; --line:#e2e2e8; --line2:#eeeef2;
  --navy:#110d54; --on-navy:#ffffff; --link:#110d54; --orange:#ff5500; --orange-ink:#b33c00;
  --nav-bg:#110d54; --nav-ink:#d9d8ef; --nav-sec:#9c9ac4; --nav-hover:#221d6e; --nav-on:#ffffff; --nav-on-ink:#110d54;
  --warn-bg:#fff1e8; --warn:#a33600; --ok-bg:#e8f0fb; --ok:#1f4f9e; --mute-bg:#efeff3; --mute:#4a4a5c;
  --bad-bg:#fdecea; --bad:#b42318; --good-bg:#e7f5ec; --good:#1d6b3a;
  --bar:#ececf1; --bar-fill:#110d54; --bar-hot:#ff5500; --overlay:rgba(17,13,84,.35);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0e1d; --surface:#18172c; --surface2:#1e1d35; --ink:#ececf4; --muted:#a3a2bd; --line:#2c2b47; --line2:#24233c;
  --navy:#5b55e0; --on-navy:#ffffff; --link:#b3b0ff; --orange:#ff7a3d; --orange-ink:#ff9a66;
  --nav-bg:#0a0820; --nav-ink:#cfcde8; --nav-sec:#7e7ca8; --nav-hover:#1d1a52; --nav-on:#25226a; --nav-on-ink:#ffffff;
  --warn-bg:#3b1e0f; --warn:#ffb48a; --ok-bg:#16264a; --ok:#a3c4ff; --mute-bg:#26253d; --mute:#c4c3da;
  --bad-bg:#3d1515; --bad:#ff9b8f; --good-bg:#123321; --good:#8fd9a8;
  --bar:#2c2b47; --bar-fill:#8f8aff; --bar-hot:#ff7a3d; --overlay:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0e1d; --surface:#18172c; --surface2:#1e1d35; --ink:#ececf4; --muted:#a3a2bd; --line:#2c2b47; --line2:#24233c;
  --navy:#5b55e0; --on-navy:#ffffff; --link:#b3b0ff; --orange:#ff7a3d; --orange-ink:#ff9a66;
  --nav-bg:#0a0820; --nav-ink:#cfcde8; --nav-sec:#7e7ca8; --nav-hover:#1d1a52; --nav-on:#25226a; --nav-on-ink:#ffffff;
  --warn-bg:#3b1e0f; --warn:#ffb48a; --ok-bg:#16264a; --ok:#a3c4ff; --mute-bg:#26253d; --mute:#c4c3da;
  --bad-bg:#3d1515; --bad:#ff9b8f; --good-bg:#123321; --good:#8fd9a8;
  --bar:#2c2b47; --bar-fill:#8f8aff; --bar-hot:#ff7a3d; --overlay:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
a{color:var(--link)} a:hover{color:var(--orange-ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-family:Calibri,Carlito,var(--font);font-variant-numeric:tabular-nums lining-nums}
h1{font-size:26px;line-height:1.2;margin:4px 0 0;text-wrap:balance;font-weight:700}
h2{font-size:17px;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:13px;margin:6px 0 0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--nav-bg);padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:auto}
.brand{color:#fff;padding:4px 14px 10px}
.brand b{display:block;font-size:17px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--nav-sec)}
.brand i{display:inline-block;width:10px;height:10px;background:var(--orange);border-radius:2px;margin-right:8px}
.sec{font-size:11px;color:var(--nav-sec);letter-spacing:.1em;padding:16px 14px 6px;font-weight:600}
nav.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;color:var(--nav-ink);text-decoration:none;font-size:14px}
nav.side a:hover{background:var(--nav-hover);color:#fff}
nav.side a.on{background:var(--nav-on);color:var(--nav-on-ink);font-weight:600}
.badge{background:var(--orange);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.navfoot{padding:18px 14px 0;font-size:12px;color:var(--nav-sec);display:grid;gap:8px}
.navfoot button{background:transparent;border:1px solid var(--nav-sec);color:var(--nav-ink);border-radius:6px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;justify-self:start}
main{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start;min-width:0;max-width:1400px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow,.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.eyebrow a{color:var(--muted)}
.sub{margin:6px 0 0;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.card>.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hint{font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.kpi .kv{font-size:clamp(19px,1.9vw,24px);font-weight:600;margin:6px 0 2px;overflow-wrap:anywhere}
.kpi .foot{font-size:13px;color:var(--muted)}
.kpi.bad{border-color:var(--bad);background:var(--bad-bg)} .kpi.bad .kv{color:var(--bad)}
.kpi.good .kv{color:var(--good)}
.kpi.warn{border-color:var(--orange)}
.kpi.click{cursor:pointer;position:relative;transition:box-shadow .15s,transform .15s}.kpi.click:hover{box-shadow:0 2px 10px rgba(17,13,84,.12);transform:translateY(-1px)}.kpi.click:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.kpi .more{position:absolute;top:14px;right:14px;font-size:12px;font-weight:600;color:var(--navy-ink,var(--navy))}
.mdl.wide{width:min(1100px,100%);max-height:calc(100vh - 40px);overflow:auto}
.agebx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.agebx>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.agebx b{display:block;font-size:18px;margin-top:2px}
.odl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}.odl li{display:grid;grid-template-columns:92px minmax(0,1fr) 70px 100px;gap:10px;align-items:baseline}.odl li:before{content:none}.odl .nm{overflow-wrap:anywhere}.odl .num{text-align:right}
@media(max-width:600px){.odl li{grid-template-columns:auto 1fr;row-gap:0}.odl .num{text-align:left}}
tr.rowclick{cursor:pointer}tr.rowclick:hover td{background:var(--surface2)}tr.rowclick:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}.rmore{font-size:12px;font-weight:600;color:var(--navy);opacity:0;margin-left:6px}tr.rowclick:hover .rmore,tr.rowclick:focus-visible .rmore{opacity:1}
.cobox{border:1px solid var(--line);border-radius:10px;background:var(--surface)}.cobox>summary{list-style:none;display:flex;gap:14px;align-items:center;padding:12px 16px;cursor:pointer}.cobox>summary::-webkit-details-marker{display:none}
.cobox .logo{width:38px;height:38px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
.cobox[open]>summary{border-bottom:1px solid var(--line)}.cobox[open] .chev{visibility:hidden}.fwchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cobody{padding:14px 16px 16px}.cobody h3,.fwdef h3{margin:0 0 8px;font-size:14px}
.fw3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))!important}
.fw{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}.fw:has(.fwon:checked){border-color:var(--navy);box-shadow:inset 3px 0 0 var(--orange)}
.fwhd{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.fwhd input{margin-top:3px}.fwhd>span{display:grid}
.fwterms{margin-top:10px}.fw:not(:has(.fwon:checked)) .fwterms{display:none}
.mdl:has(#n_on_capboost:checked) .nofw,.mdl:has(#n_on_factoring:checked) .nofw{display:none}
.fwdef{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
@media(max-width:600px){.cobox>summary{flex-wrap:wrap}.fwchips{justify-content:flex-start}}
.cotabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border-bottom:1px solid var(--line);margin-top:-6px}
.cotabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.cotabs a:hover{color:var(--ink)}.cotabs a.on{color:var(--navy-ink,var(--ink));border-bottom-color:var(--orange)}
.cotabs .grp.sep{padding:0;margin-left:10px;height:22px}.cotabs .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px 0 18px;margin-left:8px;border-left:1px solid var(--line)}
nav.side a.coitem{font-size:13.5px}nav.side a.coitem.open{background:var(--nav-hover);color:#fff}
nav.side .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-right:9px;vertical-align:middle}nav.side .dot.park{background:var(--nav-sec)}
.subsec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-sec);padding:8px 12px 2px}.subnav2{display:grid;gap:2px;margin-left:10px}
.subnav{display:grid;gap:2px;margin:2px 0 6px 18px;padding-left:8px;border-left:1px solid rgba(255,255,255,.18)}.subnav a{padding:7px 12px;font-size:13px}
.lilink{text-decoration:none;color:inherit;border-radius:8px}.lilink:hover{background:var(--surface2)}
@media(max-width:700px){.cotabs .grp{display:none}}
.kpi.hl{border-color:var(--navy);box-shadow:inset 0 3px 0 var(--orange)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g-wide{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tbody tr:hover{background:var(--surface2)}
tr.tot td{font-weight:600;border-bottom:0;border-top:1px solid var(--line)}
tr.tot:hover{background:transparent}
.r{text-align:right}
.small{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--navy);color:var(--ink)}
.btn.pri{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.pri:hover{color:var(--on-navy);filter:brightness(1.15)}
.btn.or{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.warn{background:var(--warn-bg);color:var(--warn)} .ok{background:var(--ok-bg);color:var(--ok)} .mute{background:var(--mute-bg);color:var(--mute)}
.bad{background:var(--bad-bg);color:var(--bad)} .good{background:var(--good-bg);color:var(--good)}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;width:110px;flex:0 0 auto}
.bar.full{width:100%}
.bar i{display:block;height:100%;background:var(--bar-fill);border-radius:4px}
.bar i.hot{background:var(--bar-hot)}
.usage{display:flex;align-items:center;gap:8px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:10px;border:1px solid;font-size:14px}
.alert.warn{border-color:var(--orange)} .alert.bad{border-color:var(--bad)}
.alert svg{flex:0 0 auto;margin-top:1px}
.alert b{display:block}
.alert a{margin-left:auto;white-space:nowrap;font-weight:600}
.list{display:grid}
.list .li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.list .li:last-child{border-bottom:0}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.node{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:1 1 130px;min-width:0}
.node b{display:block;font-size:13px}
.node span{font-size:13px;color:var(--muted)}
.node.hl{border-color:var(--orange)}
.arr{align-self:center;color:var(--muted)}
.hbars{display:grid;gap:14px}
.hbars .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.hbars .trk{height:14px;background:var(--bar);border-radius:4px;overflow:hidden}
.hbars .trk i{display:block;height:100%;border-radius:4px;background:var(--bar-fill)}
.hbars .trk i.o{background:var(--orange)} .hbars .trk i.m{background:var(--muted)}
.cos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.co{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;text-decoration:none;color:var(--ink)}
.co:hover{border-color:var(--navy);color:var(--ink)}
.co .top{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--navy);color:var(--on-navy);flex:0 0 auto}
.co .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px solid var(--line2)}
.co .stats span{display:block;font-size:12px;color:var(--muted)} .co .stats b{font-size:18px}
.go{font-weight:600;color:var(--link)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.in,select.in,textarea.in{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);min-width:0}
textarea.in{padding:10px 12px;width:100%;min-height:210px;font-family:var(--mono);font-size:13px;resize:vertical}
.in.grow{flex:1 1 240px}
.nm{font-weight:600;text-decoration:none} .nm:hover{text-decoration:underline}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.tab.on{border-color:var(--navy);box-shadow:inset 0 -3px 0 var(--orange);font-weight:600}
.iconbtn{padding:0 10px}.iconbtn svg{display:block}.ocrm{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto}
.tllist{list-style:none;margin:0;padding:0;display:grid}.tllist li{padding:14px 0 14px 22px;border-top:1px solid var(--line);position:relative}.tllist li:first-child{border-top:0}
.tllist li:before{content:'';position:absolute;left:4px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--orange)}
.tlrow{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}.tldate{font-size:15px}.tltext{margin-top:4px;font-size:15px;line-height:1.55}
.rolesw{background:transparent;color:var(--nav-ink);border:1px solid var(--nav-sec);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;justify-self:start}.rolesw option{color:#111}
.case-right{display:grid;gap:20px;min-width:0}
.rmadd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.rmadd textarea{min-height:0;font-family:var(--font);font-size:14px}
.rmlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}.rmlist li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface2)}
.rmlist li:before{content:none}.rmlist p{margin:6px 0 0;font-size:14px;line-height:1.5}.rmlist textarea{min-height:0;font-family:var(--font);font-size:14px}
.rmmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}.rmmeta b{color:var(--ink)}.rmacts{margin-left:auto;display:flex;gap:6px}
@media(max-width:600px){.rmadd{grid-template-columns:minmax(0,1fr)}}
.xsub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.tabgrp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;align-self:center;padding:0 4px}
.ruletbl td{padding:6px 6px}.ruletbl .in{width:100%;min-width:120px}
th.thx{cursor:pointer;user-select:none;position:relative}th.thx:hover{color:var(--ink)}th.thx:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.thi{display:inline-flex;align-items:center;gap:3px;margin-left:4px;font-size:10px;color:var(--orange-ink)}.thc{color:var(--muted);opacity:.0;font-size:10px}th.thx:hover .thc,th.thx:focus-visible .thc{opacity:1}.thf{width:6px;height:6px;border-radius:50%;background:var(--orange);display:inline-block}
.thmenu{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(17,13,84,.18);padding:8px;width:260px;display:grid;gap:4px;text-transform:none;letter-spacing:0;font-size:14px}
.thmenu>button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--ink)}.thmenu>button:hover,.thmenu>button:focus-visible{background:var(--surface2)}
.thsep{height:1px;background:var(--line);margin:4px 0}.thvals{max-height:200px;overflow:auto;display:grid;gap:2px;padding:4px 2px}.thvals label{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:3px 4px}
.thacts{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}.fbar{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:6px 10px;margin-bottom:6px}
.vsub{display:block;margin-top:2px}
.g-case{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:20px;align-items:start}.case-left{display:grid;gap:20px;min-width:0}
.g-case .terms{grid-template-columns:minmax(0,1fr);gap:12px}.g-case .terms .kvp{text-align:left}
@media(max-width:1000px){.g-case{grid-template-columns:minmax(0,1fr)}}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px}
.kvp span{display:block;font-size:12px;color:var(--muted)} .kvp b{font-size:15px}
.divider{border-top:1px solid var(--line2);margin:16px 0}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:10px;padding:18px;cursor:pointer;color:var(--muted);text-align:center}

.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:12px}

.fld label{font-size:13px;color:var(--muted)}
.fld .in{min-height:34px;width:100%}
.match{border-radius:8px;padding:12px;margin-top:12px;font-size:14px}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--orange);padding:4px 0 4px 10px;margin-top:10px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.f{display:grid;gap:4px;min-width:0}

.step b{font-size:22px;display:block} .step span{font-size:13px;color:var(--muted)}
.step.hl{border-color:var(--navy);box-shadow:inset 0 3px 0 var(--orange)}
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.mdl{background:var(--surface);border-radius:12px;padding:22px;width:min(560px,100%);display:grid;gap:14px;border:1px solid var(--line)}

.prev .sline{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:center;padding:5px 0}
.prev .stitem{display:grid;grid-template-columns:minmax(0,1fr) 104px 110px auto;gap:6px;align-items:center}

.sline .in{width:100%}

/* ===== Calculations (all balances come from the ledger) ===== */
function balances(){
  const b={principal:0,alloc:{},cofSum:{},dep:{},park:{},income:{},cof:{},exp:{},paidOut:0,yieldIn:0};
  const add=(o,k,a)=>o[k]=(o[k]||0)+a;
  for(const r of S.ledger){const a=r.amount,f=r.from.split(':')[1],t=r.to.split(':')[1];
    switch(r.type){
      case 'investor_in':b.principal+=a;break;
      case 'investor_principal_repaid':b.principal-=a;break;
      case 'allocation':add(b.alloc,t,a);add(b.cofSum,t,a*(r.rate!=null?r.rate:((coById(t)||{}).cofRate||0)));break;
      case 'recall':{const w=b.alloc[f]?(b.cofSum[f]||0)/b.alloc[f]:0;add(b.alloc,f,-a);add(b.cofSum,f,-a*w);break}
      case 'park':add(b.park,t,a);break;
      case 'unpark':add(b.park,f,-a);break;
      case 'disbursement':add(b.dep,f,a);break;
      case 'repayment_principal':case 'principal_writeoff':add(b.dep,t,-a);break;
      case 'other_charge':add(b.income,t,a);break;
      case 'repayment_profit':add(b.income,t,a);break;
      case 'cof_transfer':add(b.cof,f,a);break;
      case 'expense':add(b.exp,f,a);break;
      case 'parking_yield':b.yieldIn+=a;break;
      case 'investor_profit_payout':b.paidOut+=a;break;}}
  b.allocT=sum(Object.values(b.alloc));b.parkT=sum(Object.values(b.park));b.depT=sum(Object.values(b.dep));
  b.idle=r2(b.principal-b.allocT-b.parkT);
  b.avail=id=>r2((b.alloc[id]||0)-(b.dep[id]||0));
  b.coRate=id=>(b.alloc[id]||0)>0.5?(b.cofSum[id]||0)/b.alloc[id]:((coById(id)||{}).cofRate||0);
  b.usage=id=>b.alloc[id]?(b.dep[id]||0)/b.alloc[id]*100:0;
  b.profitAcct=r2(sum(Object.values(b.cof))+b.yieldIn-b.paidOut);
  return b;
}
const cofMonthly=(b,c)=>r2(S.settings.cofBase==='allocated'?Math.max(0,b.cofSum[c.id]||0)/1200:(b.dep[c.id]||0)*b.coRate(c.id)/1200);
const maturity=f=>addM(f.start,f.tenor);
const terms=f=>[...(f.history||[]),{start:f.start,tenor:f.tenor,rate:f.rate}];
function payoutDate(f,ym){const[y,m]=ym.split('-').map(Number);return iso(y,m,Math.min(f.payoutDay,dim(y,m)))}
function fundRateIn(f,ym){
  if(f.status==='repaid'&&f.repaidOn&&ymOf(f.repaidOn)<ym)return 0;
  for(const t of terms(f)){const k=mIdx(ym)-mIdx(ymOf(t.start));if(k>=1&&k<=t.tenor)return t.rate}
  return 0;
}
function monthFig(ym,b){
  const[y,m]=ym.split('-').map(Number),ms=iso(y,m,1),me=iso(y,m,dim(y,m));
  const pays=S.funds.map(f=>{const r=fundRateIn(f,ym);if(!r)return null;
    return{f,amt:r2(f.principal*r/1200),date:payoutDate(f,ym),paid:S.ledger.some(l=>l.type==='investor_profit_payout'&&l.ref===f.id+':'+ym)}}).filter(Boolean);
  const cos=S.companies.map(c=>{let cb=0,fee=0;
    S.cases.filter(k=>k.companyId===c.id).forEach(k=>k.rows.forEach(r=>{if(ymOf(r.due)===ym)cb+=r.profit-(r.waived||0)}));
    S.invoices.forEach(i=>{if(i.companyId===c.id&&i.fundedOn&&i.fundedOn<=me&&(!i.collectedOn||i.collectedOn>=ms))fee+=i.advanced*feeOf(i)/100});
    const inc=cb+fee,cof=cofMonthly(b,c),exp=r2(sum(S.ledger.filter(l=>l.type==='expense'&&l.from==='co:'+c.id&&l.date>=ms&&l.date<=me),l=>l.amount));
    return{c,cb:r2(cb),fee:r2(fee),inc:r2(inc),cof,exp,net:r2(inc-cof),net2:r2(inc-cof-exp),dep:b.dep[c.id]||0,alloc:b.alloc[c.id]||0,posted:cof<=0||S.ledger.some(l=>l.type==='cof_transfer'&&l.ref===c.id+':'+ym)}});
  const yieldM=r2(sum(S.buckets,k=>(b.park[k.id]||0)*k.yield/1200));
  const payable=r2(sum(pays,p=>p.amt)),income=r2(sum(cos,c=>c.inc)),cofT=r2(sum(cos,c=>c.cof)),recovered=r2(cofT+yieldM);
  return{ym,pays,payable,cos,yieldM,income,cofT,recovered,surplus:r2(recovered-payable)};
}
function maturityPlans(b){
  let idle=Math.max(0,b.idle),park=Math.max(0,b.parkT);const avail={};S.companies.forEach(c=>avail[c.id]=Math.max(0,b.avail(c.id)));
  return S.funds.filter(f=>f.status==='active').map(f=>({f,mat:maturity(f)})).sort((x,y)=>x.mat<y.mat?-1:1).map(({f,mat})=>{
    let need=f.principal;const parts=[];
    const take=(amt,label)=>{const t=Math.min(need,amt);if(t>0){parts.push([label,t]);need-=t}return t};
    idle-=take(idle,'Pool cash');park-=take(park,'Parking');
    Object.keys(avail).sort((a,c)=>avail[c]-avail[a]).forEach(id=>{avail[id]-=take(avail[id],'Recall '+coById(id).name.split(' (')[0])});
    const ml=days(AS_OF,mat)/30.44;
    return{f,mat,ml,parts,short:r2(need),inWindow:ml<=S.settings.maturityMonths};
  });
}
const inst=r=>r2(r.principal+r.profit), recd=r=>r2((r.recP||0)+(r.recF||0)), owe=r=>r2(inst(r)-recd(r)-(r.waived||0));
function caseInfo(k){
  const total=r2(sum(k.rows,inst)),received=r2(sum(k.rows,recd)),waived=r2(sum(k.rows,r=>r.waived||0)),principalOut=r2(k.amount-sum(k.rows,r=>r.recP||0));
  const unpaid=k.rows.filter(r=>owe(r)>0.004),od=unpaid.filter(r=>r.due<AS_OF);
  const next=unpaid.find(r=>r.due>=AS_OF)||unpaid[0]||null;
  const paidCount=k.rows.length-unpaid.length;
  const overdue=r2(sum(od,owe)),dpd=od.length?days(od[0].due,AS_OF):0;
  const status=!unpaid.length?'Settled':overdue>0?'Overdue':(paidCount===0&&!k.rows.some(r=>r.due<AS_OF))?'New':'Active';
  return{total,received,waived,balance:r2(total-received-waived),principalOut,unpaid,next,paidCount,overdue,dpd,status};
}
const statusChip=s=>({Settled:'mute',Overdue:'warn',New:'ok',Active:'ok',Current:'ok'}[s]||'mute');
function custSummary(cu,coId){
  const cs=S.cases.filter(k=>k.customerId===cu.id&&(coId==='all'||k.companyId===coId));
  const iv=S.invoices.filter(i=>i.clientId===cu.id&&(coId==='all'||i.companyId===coId));
  if(!cs.length&&!iv.length)return null;
  const infos=cs.map(caseInfo);
  const live=iv.filter(i=>i.status==='funded');
  let next=null,nextAmt=0;
  cs.forEach((k,i)=>{const n=infos[i].next;if(n&&n.due>=AS_OF&&(!next||n.due<next)){next=n.due;nextAmt=owe(n)}});
  live.forEach(i=>{if(i.debtorDue>=AS_OF&&(!next||i.debtorDue<next)){next=i.debtorDue;nextAmt=i.amount}});
  const ivOver=live.filter(i=>i.debtorDue<AS_OF);
  const overdue=r2(sum(infos,x=>x.overdue)+sum(ivOver,i=>i.advanced));
  const dpd=Math.max(0,...infos.map(x=>x.dpd),...ivOver.map(i=>days(i.debtorDue,AS_OF)));
  const active=infos.filter(x=>x.status!=='Settled').length+live.length+iv.filter(i=>['submitted','verified'].includes(i.status)).length;
  const status=overdue>0?'Overdue':active===0?'Settled':infos.length&&infos.every(x=>x.status==='New'||x.status==='Settled')&&infos.some(x=>x.status==='New')?'New':'Active';
  const others=coId==='all'?[]:[...new Set(S.cases.filter(k=>k.customerId===cu.id).map(k=>k.companyId).concat(S.invoices.filter(i=>i.clientId===cu.id).map(i=>i.companyId)))].filter(x=>x!==coId);
  return{cu,cases:cs.length+iv.length,active,total:r2(sum(cs,k=>k.amount)+sum(iv.filter(i=>i.fundedOn),i=>i.advanced)),
    outstanding:r2(sum(infos,x=>x.balance)+sum(live,i=>i.advanced)),next,nextAmt,overdue,dpd,status,others};
}
function alertsList(b){
  const a=[];
  if(b.idle>0.5)a.push({sev:'bad',t:rm(b.idle)+' sitting in the pool, not allocated',d:'All investor money should go to a company. Allocate it now.',href:'#pool'});

const AGE=[['1–30 days',1,30],['31–60 days',31,60],['61–90 days',61,90],['90+ days',91,1e9]];
function cbListHTML(kind,scope){
  const cos=scopeCos(scope,'capboost'),ids=cos.map(c=>c.id),all=scope==='all';

  const coTd=x=>all?'<td>'+esc(coById(x.k.companyId).name)+'</td>':'',coTh=all?'<th>Company</th>':'';
  if(kind==='od'){
    cs=cs.filter(x=>x.i.status!=='Settled'&&x.i.overdue>0).sort((a,b)=>b.i.dpd-a.i.dpd);
    const ageOf=d=>AGE.find(a=>d>=a[1]&&d<=a[2]);
    const box='<div class="agebx">'+AGE.map(a=>{const g=cs.filter(x=>ageOf(x.i.dpd)===a);return '<div'+(g.length&&a[1]>30?' style="border-color:var(--orange)"':'')+'><span class="small">'+a[0]+' · '+g.length+' case'+(g.length===1?'':'s')+'</span><b class="num"'+(g.length?' style="color:var(--orange-ink)"':'')+'>RM '+fmt(r2(sum(g,x=>x.i.overdue)),0)+'</b></div>'}).join('')+'</div>';
    const rows=cs.map(x=>{const od=x.i.unpaid.filter(r=>r.due<AS_OF),lastPay=S.payments.filter(p=>p.caseId===x.k.id).map(p=>p.date).sort().pop(),cust=custById(x.k.customerId);
      return '<tr><td>'+cu(x)+'</td>'+coTd(x)+'<td>'+esc(cust.name)+'<div class="small">'+esc(cust.director)+' · '+esc(cust.phone)+'</div></td><td>'+fds(od[0].due)+'</td><td class="r num">'+x.i.dpd+'</td><td>'+chip(ageOf(x.i.dpd)[0],x.i.dpd>30?'bad':'warn')+'</td><td class="r num">'+od.length+'</td><td class="r num" style="font-weight:600;color:var(--orange-ink)">'+fmt(x.i.overdue)+'</td><td class="r num">'+fmt(x.i.principalOut)+'</td><td>'+(lastPay?fds(lastPay):'None')+'</td></tr>'}).join('');
    return '<p class="small" style="margin:0">Overdue = instalments past their due date and not yet paid, as at '+fd(AS_OF)+'. Aging is by days since the oldest unpaid instalment.</p>'+box+
      '<div class="tw"><table><thead><tr><th>Case</th>'+coTh+'<th>Customer</th><th>Overdue since</th><th class="r">Days</th><th>Aging</th><th class="r">Missed</th><th class="r">Overdue amount</th><th class="r">Principal out</th><th>Last payment</th></tr></thead><tbody>'+
      (rows||'<tr><td colspan="10" class="small">No overdue cases</td></tr>')+
      '<tr class="tot"><td colspan="'+(all?6:5)+'">Total · '+cs.length+' case'+(cs.length===1?'':'s')+'</td><td class="r num">'+sum(cs,x=>x.i.unpaid.filter(r=>r.due<AS_OF).length)+'</td><td class="r num">'+fmt(r2(sum(cs,x=>x.i.overdue)))+'</td><td class="r num">'+fmt(r2(sum(cs,x=>x.i.principalOut)))+'</td><td></td></tr></tbody></table></div>';

function cbMonthHTML(ym,scope){

  const cs=S.cases.filter(k=>ids.includes(k.companyId)).map(k=>({k,i:caseInfo(k)}));

  const coTd=x=>all?'<td>'+esc(coById(x.k.companyId).name)+'</td>':'',coTh=all?'<th>Company</th>':'';
  const iss=cs.filter(x=>ymOf(x.k.start)===ym).sort((a,b)=>a.k.start<b.k.start?-1:1);
  const pr=[];cs.forEach(x=>x.k.rows.forEach(r=>{if(ymOf(r.due)===ym)pr.push({x,r})}));pr.sort((a,b)=>a.r.due<b.r.due?-1:1);
  const gotOf=x=>r2(sum(S.ledger.filter(l=>l.type==='repayment_profit'&&l.from==='case:'+x.k.id&&ymOf(l.date)===ym),l=>l.amount));
  const st=r=>owe(r)<=0.004?(r.waived?chip('Settled','mute'):chip('Paid','good')):r.due<AS_OF?chip('Overdue','bad'):chip('Due','');
  const due=r2(sum(pr,p=>p.r.profit-(p.r.waived||0))),seen=new Set(),got=r2(sum(pr.filter(p=>!seen.has(p.x.k.id)&&seen.add(p.x.k.id)),p=>gotOf(p.x)));
  return '<h3 style="margin:4px 0 0;font-size:15px">Cases issued · '+iss.length+' · RM '+fmt(r2(sum(iss,x=>x.k.amount)))+'</h3>'+
    (iss.length?'<div class="tw"><table><thead><tr><th>Case</th>'+coTh+'<th>Customer</th><th>Issued on</th><th class="r">Amount</th><th class="r">Rate / mth</th><th>Tenure</th><th class="r">Monthly instalment</th><th class="r">Principal out</th><th>Status</th></tr></thead><tbody>'+
      iss.map(x=>'<tr><td>'+link(x)+'</td>'+coTd(x)+'<td>'+esc(custById(x.k.customerId).name)+'</td><td>'+fds(x.k.start)+'</td><td class="r num">'+fmt(x.k.amount)+'</td><td class="r num">'+x.k.rate.toFixed(1)+'%</td><td>'+x.k.tenure+' m</td><td class="r num">'+fmt(inst(x.k.rows[0]))+'</td><td class="r num">'+fmt(x.i.principalOut)+'</td><td>'+chip(x.i.status==='Settled'?'Fully paid':x.i.status,statusChip(x.i.status))+'</td></tr>').join('')+
      '<tr class="tot"><td colspan="'+(all?4:3)+'">Total</td><td class="r num">'+fmt(r2(sum(iss,x=>x.k.amount)))+'</td><td colspan="3"></td><td class="r num">'+fmt(r2(sum(iss,x=>x.i.principalOut)))+'</td><td></td></tr></tbody></table></div>':'<p class="small" style="margin:0">No cases issued this month.</p>')+
    '<h3 style="margin:10px 0 0;font-size:15px">Profit this month · due RM '+fmt(due)+(ym<=ymOf(AS_OF)?' · received RM '+fmt(got):'')+'</h3>'+
    (pr.length?'<div class="tw"><table><thead><tr><th>Case</th>'+coTh+'<th>Customer</th><th>Instalment</th><th>Due date</th><th class="r">Instalment</th><th class="r">Profit due</th><th class="r">Profit received</th><th>Status</th></tr></thead><tbody>'+
      pr.map(({x,r})=>'<tr><td>'+link(x)+'</td>'+coTd(x)+'<td>'+esc(custById(x.k.customerId).name)+'</td><td>#'+r.n+' of '+x.k.tenure+'</td><td>'+fds(r.due)+'</td><td class="r num">'+fmt(inst(r))+'</td><td class="r num">'+fmt(r2(r.profit-(r.waived||0)))+'</td><td class="r num">'+(r.recF?fmt(r.recF):'—')+'</td><td>'+st(r)+'</td></tr>').join('')+
      '<tr class="tot"><td colspan="'+(all?5:4)+'">Total · '+pr.length+' instalments</td><td class="r num">'+fmt(r2(sum(pr,p=>inst(p.r))))+'</td><td class="r num">'+fmt(due)+'</td><td class="r num">'+fmt(r2(sum(pr,p=>p.r.recF||0)))+'</td><td></td></tr></tbody></table></div>':'<p class="small" style="margin:0">No instalments due this month.</p>')+

function fMonthHTML(ym,scope){

  const coTd=i=>all?'<td>'+esc(coById(i.companyId).name)+'</td>':'',coTh=all?'<th>Company</th>':'';
  const st=i=>i.status==='collected'?chip('Collected','mute'):i.debtorDue<AS_OF?chip('Overdue','bad'):chip('Funded','ok');
  const f=invs.filter(i=>ymOf(i.fundedOn)===ym).sort((a,b)=>a.fundedOn<b.fundedOn?-1:1);

    (f.length?'<div class="tw"><table><thead><tr><th>Invoice</th>'+coTh+'<th>Client</th><th>Debtor</th><th>Funded on</th><th class="r">Invoice amount</th><th class="r">Advanced</th><th>Debtor due</th><th>Status</th></tr></thead><tbody>'+
      f.map(i=>'<tr><td>'+i.no+'</td>'+coTd(i)+'<td><a href="#customer-'+i.clientId+'">'+esc(custById(i.clientId).name)+'</a></td><td>'+esc(i.debtor)+'</td><td>'+fds(i.fundedOn)+'</td><td class="r num">'+fmt(i.amount)+'</td><td class="r num">'+fmt(i.advanced)+'</td><td>'+fds(i.debtorDue)+'</td><td>'+st(i)+'</td></tr>').join('')+

    '<h3 style="margin:10px 0 0;font-size:15px">Fee this month · earned RM '+fmt(r2(sum(out,i=>i.advanced*feeOf(i)/100)))+' · received RM '+fmt(r2(sum(out,got)))+'</h3>'+
    (out.length?'<div class="tw"><table><thead><tr><th>Invoice</th>'+coTh+'<th>Client</th><th class="r">Advanced</th><th class="r">Fee % / mth</th><th class="r">Fee earned</th><th class="r">Fee received</th><th>Status</th></tr></thead><tbody>'+
      out.map(i=>'<tr><td>'+i.no+'</td>'+coTd(i)+'<td>'+esc(custById(i.clientId).name)+'</td><td class="r num">'+fmt(i.advanced)+'</td><td class="r num">'+feeOf(i)+'%</td><td class="r num">'+fmt(r2(i.advanced*feeOf(i)/100))+'</td><td class="r num">'+(got(i)?fmt(got(i)):'—')+'</td><td>'+st(i)+'</td></tr>').join('')+
      '<tr class="tot"><td colspan="'+(all?3:2)+'">Total · '+out.length+' invoices</td><td class="r num">'+fmt(r2(sum(out,i=>i.advanced)))+'</td><td></td><td class="r num">'+fmt(r2(sum(out,i=>i.advanced*feeOf(i)/100)))+'</td><td class="r num">'+fmt(r2(sum(out,got)))+'</td><td></td></tr></tbody></table></div>':'<p class="small" style="margin:0">No invoices out this month.</p>')+
    '<p class="small" style="margin:0">Fee earned = the company’s fee % of the advance for each invoice still out during the month. The fee is received in one go when the debtor pays.</p>';

function ocrMatch(o){
  const ref=String(o.ref||'').trim().toUpperCase().replace(/\s+/g,' ');
  const dup=ref?S.payments.find(p=>p.ref.toUpperCase().replace(/\s+/g,' ')===ref):null;
  const pn=norm(o.payer);let cu=null;
  if(pn.length>=3)cu=S.customers.find(c=>{const n=norm(c.name);return n&&(n.includes(pn)||pn.includes(n))});
  let k=null,row=null;
  if(cu){const open=S.cases.filter(x=>x.customerId===cu.id&&caseInfo(x).unpaid.length);
    for(const x of open){const r=caseInfo(x).unpaid[0];if(Math.abs(owe(r)-num(o.amount))<0.01){k=x;row=r;break}}
    if(!k&&open.length){k=open.find(x=>x.id===o.caseId)||open[0];row=caseInfo(k).unpaid[0]}}
  return{dup,cu,k,row};
}

/* ===== Money actions ===== */
/* OD (late) charges: per late month, OD rate % of the loan. The 1.5% part is always collected first, the rest is Extra. */
const odT=co=>{const t=cbT(co);return{od:t.od!=null?t.od:6,odCof:t.odCof!=null?t.odCof:1.5,grace:t.grace!=null?t.grace:7}};
function odInfo(k,r){const t=odT(k.companyId),paid=owe(r)<=0.004;
  const late=r.due<AS_OF?(paid?(r.date&&r.date>r.due?days(r.due,r.date):0):days(r.due,AS_OF)):0;
  const months=late>t.grace?Math.ceil(late/30):0;
  const cof=r2(k.amount*t.odCof/100*months),extra=r.extraOv!=null?r2(r.extraOv):r2(k.amount*(t.od-t.odCof)/100*months);
  return{late,months,cof,extra,cofOut:r2(Math.max(0,cof-(r.odCofRec||0))),extraOut:r2(Math.max(0,extra-(r.extraRec||0))),t}}
const odOut=k=>{const x=k.rows.map(r=>odInfo(k,r));return{cof:r2(sum(x,o=>o.cofOut)),extra:r2(sum(x,o=>o.extraOut)),tot:r2(sum(x,o=>o.cofOut+o.extraOut))}};
function payPlan(k,amount){let rem=r2(amount);const steps=[];
  for(const r of k.rows){if(rem<=0.004)break;if(r.waived>0)continue;const o=odInfo(k,r);
    const parts=[['cof',o.cofOut],['extra',o.extraOut],['profit',r2(r.profit-(r.recF||0))],['principal',r2(r.principal-(r.recP||0))]];
    for(const[kind,due]of parts){if(rem<=0.004)break;if(due<=0.004)continue;const t=r2(Math.min(rem,due));steps.push({r,kind,amt:t,due});rem=r2(rem-t)}}
  return{steps,excess:rem}}
function applyPayment(k,amount,date,ref,source){
  const plan=payPlan(k,amount),tot={cof:0,extra:0,profit:0,principal:0},touched=[];
  for(const st of plan.steps){const r=st.r;
    if(st.kind==='cof')r.odCofRec=r2((r.odCofRec||0)+st.amt);else if(st.kind==='extra')r.extraRec=r2((r.extraRec||0)+st.amt);
    else if(st.kind==='profit')r.recF=r2((r.recF||0)+st.amt);else r.recP=r2((r.recP||0)+st.amt);
    tot[st.kind]=r2(tot[st.kind]+st.amt);if(!touched.includes(r.n))touched.push(r.n);if(st.kind==='profit'||st.kind==='principal')r.date=date}
  const c='co:'+k.companyId,tag=k.ref+' #'+touched.join(',');
  if(tot.cof>0)L(date,'other_charge','case:'+k.id,c,tot.cof,ref,tag+' OD '+odT(k.companyId).odCof+'% part');
  if(tot.extra>0)L(date,'other_charge','case:'+k.id,c,tot.extra,ref,tag+' Extra (OD)');
  if(tot.profit>0)L(date,'repayment_profit','case:'+k.id,c,tot.profit,ref,tag+' profit');
  if(tot.principal>0)L(date,'repayment_principal','case:'+k.id,c,tot.principal,ref,tag+' principal');
  S.payments.push({id:'p'+S.seq++,caseId:k.id,rows:touched,amount:r2(amount-plan.excess),date,ref,source,confirmedBy:'Chloe',split:tot});
  return{touched,excess:plan.excess,split:tot}
}
function settleCalc(k,date){const ym=ymOf(date),un=k.rows.filter(r=>owe(r)>0.004);
  const cur=k.rows.find(r=>ymOf(r.due)===ym);
  return{ym,cur,pOut:r2(sum(k.rows,r=>r.principal-(r.recP||0))),
    overdueF:r2(sum(un.filter(r=>ymOf(r.due)<ym),r=>r.profit-(r.recF||0))),
    monthF:cur?r2(Math.max(0,cur.profit-(cur.recF||0))):r2(k.amount*k.rate/100),
    futureF:r2(sum(un.filter(r=>ymOf(r.due)>ym),r=>r.profit-(r.recF||0)))}}
const stItems=fm=>[...fm.querySelectorAll('#st_items > [data-n]')].map(el=>{const n=el.dataset.n;return{label:fm['it_l_'+n].value.trim(),sign:+fm['it_s_'+n].value,amt:r2(num(fm['it_a_'+n].value))}}).filter(i=>i.amt>0||i.label);
function applySettlement(k,date,ref,o){
  const c=settleCalc(k,date),cc='co:'+k.companyId;
  const pCol=r2(Math.min(o.principal,c.pOut)),writeoff=r2(c.pOut-pCol);
  let left=r2(Math.max(0,o.profit-o.deduct)),waived=0;
  for(const r of k.rows){if(owe(r)<=0.004)continue;
    r.recP=r.principal;const fr=r2(r.profit-(r.recF||0)),t=Math.min(left,fr);
    r.recF=r2((r.recF||0)+t);left=r2(left-t);r.waived=r2(r.profit-r.recF);waived+=r.waived;r.date=date}
  const profitCol=r2(Math.max(0,o.profit-o.deduct)-left),charges=r2(o.charges+left);
  if(profitCol>0)L(date,'repayment_profit','case:'+k.id,cc,profitCol,ref,k.ref+' early settlement · profit');
  if(pCol>0)L(date,'repayment_principal','case:'+k.id,cc,pCol,ref,k.ref+' early settlement · principal');
  if(writeoff>0)L(date,'principal_writeoff','case:'+k.id,cc,writeoff,ref,k.ref+' principal written off at settlement');
  if(charges>0)L(date,'other_charge','case:'+k.id,cc,charges,ref,k.ref+' settlement charges: '+o.items.filter(i=>i.sign>0).map(i=>i.label).join(', '));
  const total=r2(pCol+profitCol+charges);
  S.payments.push({id:'p'+S.seq++,caseId:k.id,rows:[],amount:total,date,ref,source:'Early settlement',confirmedBy:'Chloe'});
  k.settlement={date,ref,principal:pCol,writeoff,profit:profitCol,charges,deduct:o.deduct,items:o.items,waived:r2(waived),total};return k.settlement}
function setRow(k,r,amount,date){
  const nf=Math.min(amount,r.profit),np=r2(amount-nf);
  const dF=r2(nf-(r.recF||0)),dP=r2(np-(r.recP||0)),c='co:'+k.companyId;
  if(dF)L(date||AS_OF,'repayment_profit','case:'+k.id,c,dF,'EDIT',k.ref+' #'+r.n+' profit (manual edit)');
  if(dP)L(date||AS_OF,'repayment_principal','case:'+k.id,c,dP,'EDIT',k.ref+' #'+r.n+' principal (manual edit)');
  r.recF=nf;r.recP=np;r.date=amount>0?date:'';
}

function saveSettings(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),err=document.getElementById('seterr');err.textContent='';
  const fail=m=>{err.textContent=m;err.scrollIntoView({block:'center'})};
  const def=readTerms(d,'d_');{const m=termsErr(def,'Framework defaults');if(m)return fail(m)}
  const upd=[];
  for(const c of S.companies){const pf='c_'+c.id+'_',nm=(d[pf+'name']||'').trim();
    if(!nm)return fail('Company name cannot be empty.');
    if(S.companies.some(o=>o!==c&&o.name.toLowerCase()===nm.toLowerCase()))return fail(nm+' is used twice.');
    const t=readTerms(d,pf),m=termsErr(t,nm);if(m)return fail(m);
    const products=['capboost','factoring'].filter(p=>d[pf+'on_'+p]);
    for(const p of ['capboost','factoring'])if(offers(c,p)&&!products.includes(p)){const busy=p==='capboost'?S.cases.some(k=>k.companyId===c.id&&caseInfo(k).status!=='Settled'):S.invoices.some(i=>i.companyId===c.id&&i.status!=='collected');
      if(busy)return fail(c.name+' still has open '+FW[p].name+' business. Settle or move it before removing the '+FW[p].name+' framework.')}
    upd.push([c,{name:nm,short:(d[pf+'short']||'').trim().toUpperCase()||c.short,prefix:(d[pf+'prefix']||'').trim().toUpperCase()||c.prefix,cofRate:num(d[pf+'cof']),threshold:num(d[pf+'th']),purpose:products.length?'':(d[pf+'pu']||'').trim(),products,terms:t}])}
  upd.forEach(([c,v])=>Object.assign(c,v));S.frameworks=def;
  if(!['Admin','Manager'].includes(me().role))return fail('Only Admin or Manager can change settings. You are viewing as '+me().role+'.');
  Object.assign(S.settings,{cofBase:d.cofBase,maturityMonths:Math.max(1,num(d.maturityMonths)),tlRoles:['Admin',...ROLES.filter(r=>r!=='Admin'&&d['tl_'+r])]});
  save();render();toast('Settings saved');}

function parsePaste(t){
  const F={},C={};
  const lab=keys=>{const m=t.match(new RegExp('^[\\s*•\\-]*(?:'+keys+')\\s*[:：=\\-]\\s*(.+)$','im'));return m?m[1].trim():''};
  let v,m;
  if(v=lab('company name|company|syarikat|nama syarikat|business name')){F.name=v;C.name=99}
  else if(m=t.match(/([A-Z][\w&.'\- ]{2,60}?\s(?:Sdn\.?\s?Bhd\.?|Berhad|Bhd|Enterprise|PLT))/)){F.name=m[1].trim();C.name=80}
  if(v=lab('ssm no\\.?|ssm|reg(?:istration)? no\\.?|roc|company no\\.?')){F.ssm=v.replace(/\s/g,'');C.ssm=97}
  else if(m=t.match(/\b((?:19|20)\d{10})\b/)){F.ssm=m[1];C.ssm=75}
  if(v=lab('ic no\\.?|ic|nric|mykad|no\\.? kp')){F.ic=v;C.ic=98}
  else if(m=t.match(/\b(\d{6}-\d{2}-\d{4})\b/)){F.ic=m[1];C.ic=90}
  if(v=lab('h/p|hp|tel|phone|mobile|no\\.? tel|contact no\\.?')){F.phone=v;C.phone=99}
  else if(m=t.match(/(?:\+?60|0)1\d[\s-]?\d{3,4}[\s-]?\d{4}/)){F.phone=m[0];C.phone=85}
  if(m=t.match(/[\w.+-]+@[\w-]+\.[\w.]+/)){F.email=m[0];C.email=99}
  if(v=lab('director|pengarah|contact person|pic|owner')){F.director=v;C.director=96}
  if(v=lab('address|alamat')){F.address=v;C.address=72}
  if(v=lab('nature of business|business|industry|perniagaan|sector')){F.industry=v.charAt(0).toUpperCase()+v.slice(1);C.industry=90}
  if((v=lab('amount applied|amount requested|financing amount|loan amount|amount|jumlah'))&&(m=v.match(/(\d[\d,]*(?:\.\d+)?)\s*(k|mil|million|juta|m)?\b/i))){let a=num(m[1]);const u=(m[2]||'').toLowerCase();if(u==='k')a*=1e3;else if(u)a*=1e6;F.amount=String(a);C.amount=97}
  else if(m=t.match(/(?:need|perlu|request(?:ed)?|amount|financing|loan|pinjaman)\D{0,20}?(?:rm\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k|mil|million|juta|m)?\b/i)||t.match(/rm\s*(\d[\d,]*(?:\.\d+)?)\s*(k|mil|million|juta|m)?\b/i)){
    let a=num(m[1]);const u=(m[2]||'').toLowerCase();if(u==='k')a*=1e3;else if(u)a*=1e6;F.amount=String(a);C.amount=94}
  if(m=t.match(/(\d{1,2})\s*(?:months?|mths?|bulan)\b/i)){F.tenure=m[1];C.tenure=92}
  else if(m=t.match(/(\d)\s*(?:years?|tahun)\b/i)){F.tenure=String(m[1]*12);C.tenure=85}
  v=lab('facility applied|type of facility|facility|product|kemudahan');const pv=(v||t).toLowerCase();
  if(/capbridge|factoring|invoice financing/.test(pv)){F.product='factoring';C.product=v?97:70}else if(/capboost/.test(pv)){F.product='capboost';C.product=v?97:70}
  v=lab('financier|lender|apply to|applied to|company applied to|pembiaya');
  if(v){const c=S.companies.find(c=>norm(v).includes(norm(c.name).split(' ')[0])||norm(c.name).includes(norm(v)));if(c){F.company=c.id;C.company=96}}
  if(v=lab('purpose|tujuan')){F.purpose=v;C.purpose=93}
  return{F,C};
}

        const od=r2(num(x.st_od));let odl=od;for(const rw of k.rows){const o=odInfo(k,rw);const a1=Math.min(odl,o.cofOut);rw.odCofRec=r2((rw.odCofRec||0)+a1);odl=r2(odl-a1);const a2=Math.min(odl,o.extraOut);rw.extraRec=r2((rw.extraRec||0)+a2);odl=r2(odl-a2)}
        const r=applySettlement(k,date,ref,{principal:pr,profit,deduct:Math.min(minus,profit),charges:r2(plus+od-Math.max(0,minus-profit)),items:od>0?items.concat([{label:'Late (OD) charges',sign:1,amt:od}]):items});
        toast(k.ref+' settled · '+rm(r.total)+' received'+(r.writeoff>0?' · '+rm(r.writeoff)+' written off':'')+' · '+rm(r.waived)+' profit waived')},'Confirm settlement',
      (fm,e)=>{const t=e&&e.target,date=fm.st_date.value||AS_OF,c=settleCalc(k,date);
        if(!e||t.id==='st_date'){fm.st_p.value=c.pOut;fm.st_m.value=c.monthF;fm.st_o.value=c.overdueF;
          document.getElementById('st_p_h').textContent='Outstanding RM '+fmt(c.pOut);

        const items=stItems(fm),plus=r2(sum(items.filter(i=>i.sign>0),i=>i.amt)),minus=r2(sum(items.filter(i=>i.sign<0),i=>i.amt));
        const pr=num(fm.st_p.value),tot=r2(pr+num(fm.st_m.value)+num(fm.st_o.value)+num(fm.st_od.value)+plus-minus),wo=r2(c.pOut-pr);
        document.getElementById('st_tot').innerHTML=(plus?'<div style="display:flex;justify-content:space-between"><span>Added items</span><b class="num">+'+rm(plus)+'</b></div>':'')+

          '<div style="display:flex;justify-content:space-between;align-items:baseline"><b>Settlement amount</b><b class="num" style="font-size:17px">'+rm(tot)+'</b></div>'+
          (wo>0.004?'<div style="display:flex;justify-content:space-between;color:var(--bad)"><span>Principal written off</span><b class="num">'+rm(wo)+'</b></div>':wo<-0.004?'<div style="color:var(--bad)">Principal is more than outstanding — add the extra as an item.</div>':'')})},

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(!a)return;

  if(t.dataset.ocr&&t.dataset.ocr!=='file'&&ui.ocr){ui.ocr[t.dataset.ocr]=t.value}});

  if(u==='st'||u==='sort'||u==='lt'||u==='cbYear'||u==='fYear'||u==='aShow'||u==='aSort'||u==='expM'||u==='expC'||u==='ccSt'||u==='ccQ'||u==='ciSt'){ui[u]=t.value;render()}
  else if(u==='month'){ui.month=t.value;render()}
  else if(u==='role'){me().role=t.value;save();render();toast('Now viewing as '+t.value)}
  else if(u==='cosw'){location.hash='customers-'+t.value}
