<script>
/* ===== Dates & formatting ===== */
const AS_OF='2026-10-28';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const KEY='flms-proto-v1';
const r2=x=>Math.round(x*100)/100;
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+f(x),0);
function D(s){const[y,m,d]=s.split('-').map(Number);return{y,m,d}}
function iso(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function addM(s,n,day){const{y,m,d}=D(s);const t=(m-1)+n;const yy=y+Math.floor(t/12);const mm=((t%12)+12)%12+1;return iso(yy,mm,Math.min(day||d,dim(yy,mm)))}
function addD(s,n){return new Date(Date.parse(s+'T00:00:00Z')+n*864e5).toISOString().slice(0,10)}
function days(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5)}
const ymOf=s=>s.slice(0,7);

function balances(){
  const b={principal:0,alloc:{},cofSum:{},dep:{},park:{},income:{},cof:{},paidOut:0,yieldIn:0};
  const add=(o,k,a)=>o[k]=(o[k]||0)+a;
  for(const r of S.ledger){const a=r.amount,f=r.from.split(':')[1],t=r.to.split(':')[1];
    switch(r.type){
      case 'investor_in':b.principal+=a;break;
      case 'investor_principal_repaid':b.principal-=a;break;
      case 'allocation':add(b.alloc,t,a);add(b.cofSum,t,a*(r.rate!=null?r.rate:((coById(t)||{}).cofRate||0)));break;
      case 'recall':{const w=b.alloc[f]?(b.cofSum[f]||0)/b.alloc[f]:0;add(b.alloc,f,-a);add(b.cofSum,f,-a*w);break}
      case 'park':add(b.park,t,a);break;
      case 'unpark':add(b.park,f,-a);break;
      case 'disbursement':add(b.dep,f,a);break;
      case 'repayment_principal':case 'principal_writeoff':add(b.dep,t,-a);break;
      case 'other_charge':add(b.income,t,a);break;
      case 'repayment_profit':add(b.income,t,a);break;
      case 'cof_transfer':add(b.cof,f,a);break;
      case 'parking_yield':b.yieldIn+=a;break;
      case 'investor_profit_payout':b.paidOut+=a;break;}}
  b.allocT=sum(Object.values(b.alloc));b.parkT=sum(Object.values(b.park));b.depT=sum(Object.values(b.dep));
  b.idle=r2(b.principal-b.allocT-b.parkT);
  b.avail=id=>r2((b.alloc[id]||0)-(b.dep[id]||0));
  b.coRate=id=>(b.alloc[id]||0)>0.5?(b.cofSum[id]||0)/b.alloc[id]:((coById(id)||{}).cofRate||0);
  b.usage=id=>b.alloc[id]?(b.dep[id]||0)/b.alloc[id]*100:0;
  b.profitAcct=r2(sum(Object.values(b.cof))+b.yieldIn-b.paidOut);
  return b;
}
const cofMonthly=(b,c)=>r2(S.settings.cofBase==='allocated'?Math.max(0,b.cofSum[c.id]||0)/1200:(b.dep[c.id]||0)*b.coRate(c.id)/1200);
const maturity=f=>addM(f.start,f.tenor);
const terms=f=>[...(f.history||[]),{start:f.start,tenor:f.tenor,rate:f.rate}];
function payoutDate(f,ym){const[y,m]=ym.split('-').map(Number);return iso(y,m,Math.min(f.payoutDay,dim(y,m)))}
function fundRateIn(f,ym){
  if(f.status==='repaid'&&f.repaidOn&&ymOf(f.repaidOn)<ym)return 0;
  for(const t of terms(f)){const k=mIdx(ym)-mIdx(ymOf(t.start));if(k>=1&&k<=t.tenor)return t.rate}
  return 0;
}
function monthFig(ym,b){
  const[y,m]=ym.split('-').map(Number),ms=iso(y,m,1),me=iso(y,m,dim(y,m));
  const pays=S.funds.map(f=>{const r=fundRateIn(f,ym);if(!r)return null;
    return{f,amt:r2(f.principal*r/1200),date:payoutDate(f,ym),paid:S.ledger.some(l=>l.type==='investor_profit_payout'&&l.ref===f.id+':'+ym)}}).filter(Boolean);
  const cos=S.companies.map(c=>{let cb=0,fee=0;
    S.cases.filter(k=>k.companyId===c.id).forEach(k=>k.rows.forEach(r=>{if(ymOf(r.due)===ym)cb+=r.profit-(r.waived||0)}));
    S.invoices.forEach(i=>{if(i.companyId===c.id&&i.fundedOn&&i.fundedOn<=me&&(!i.collectedOn||i.collectedOn>=ms))fee+=i.advanced*S.settings.factorFee/100});
    const inc=cb+fee,cof=cofMonthly(b,c);
    return{c,cb:r2(cb),fee:r2(fee),inc:r2(inc),cof,net:r2(inc-cof),dep:b.dep[c.id]||0,alloc:b.alloc[c.id]||0,posted:cof<=0||S.ledger.some(l=>l.type==='cof_transfer'&&l.ref===c.id+':'+ym)}});

function maturityPlans(b){
  let idle=Math.max(0,b.idle),park=Math.max(0,b.parkT);const avail={};S.companies.forEach(c=>avail[c.id]=Math.max(0,b.avail(c.id)));
  return S.funds.filter(f=>f.status==='active').map(f=>({f,mat:maturity(f)})).sort((x,y)=>x.mat<y.mat?-1:1).map(({f,mat})=>{
    let need=f.principal;const parts=[];
    const take=(amt,label)=>{const t=Math.min(need,amt);if(t>0){parts.push([label,t]);need-=t}return t};
    idle-=take(idle,'Pool cash');park-=take(park,'Parking');

  let next=null,nextAmt=0;
  cs.forEach((k,i)=>{const n=infos[i].next;if(n&&n.due>=AS_OF&&(!next||n.due<next)){next=n.due;nextAmt=owe(n)}});
  live.forEach(i=>{if(i.debtorDue>=AS_OF&&(!next||i.debtorDue<next)){next=i.debtorDue;nextAmt=i.amount}});
  const ivOver=live.filter(i=>i.debtorDue<AS_OF);
  const overdue=r2(sum(infos,x=>x.overdue)+sum(ivOver,i=>i.advanced));
  const dpd=Math.max(0,...infos.map(x=>x.dpd),...ivOver.map(i=>days(i.debtorDue,AS_OF)));
  const active=infos.filter(x=>x.status!=='Settled').length+live.length+iv.filter(i=>['submitted','verified'].includes(i.status)).length;
  const status=overdue>0?'Overdue':active===0?'Settled':infos.length&&infos.every(x=>x.status==='New'||x.status==='Settled')&&infos.some(x=>x.status==='New')?'New':'Active';
  const others=coId==='all'?[]:[...new Set(S.cases.filter(k=>k.customerId===cu.id).map(k=>k.companyId).concat(S.invoices.filter(i=>i.clientId===cu.id).map(i=>i.companyId)))].filter(x=>x!==coId);
  return{cu,cases:cs.length+iv.length,active,total:r2(sum(cs,k=>k.amount)+sum(iv.filter(i=>i.fundedOn),i=>i.advanced)),
    outstanding:r2(sum(infos,x=>x.balance)+sum(live,i=>i.advanced)),next,nextAmt,overdue,dpd,status,others};
}
function alertsList(b){

  const mp=maturityPlans(b).find(p=>p.inWindow);
  if(mp){const cover=r2(mp.f.principal-mp.short);
    if(mp.short>0)a.push({sev:'bad',t:'Principal maturity in '+mp.ml.toFixed(1)+' months — short '+rm(mp.short),d:invName(mp.f.investorId)+' '+rm(mp.f.principal)+' due '+fd(mp.mat)+'. Parked + recallable only '+rm(cover)+'. Roll over, add funds, or recall deployed money.',href:'#dashboard'});

  [ymOf(AS_OF),ymOf(addM(AS_OF,1))].forEach(ym=>{const m=monthFig(ym,b);if(m.surplus<0){const soon=m.pays.filter(p=>!p.paid&&days(AS_OF,p.date)<=7&&days(AS_OF,p.date)>=0);

function debtorConc(ids){
  const live=S.invoices.filter(i=>i.status==='funded'&&(!ids||ids.includes(i.companyId))),tot=sum(live,i=>i.advanced),g={};
  live.forEach(i=>g[i.debtor]=(g[i.debtor]||0)+i.advanced);

}

/* Company cash on hand up to a date: money in from pool + repayments + charges, less disbursed, COF paid and recalls.
   Write-offs are non-cash; factoring rebates pass straight through from debtor to client. */
const CASH_IN={allocation:1,repayment_principal:1,repayment_profit:1,other_charge:1},CASH_OUT={disbursement:1,cof_transfer:1,recall:1};
function coCash(id,upto){const k='co:'+id;let c=0;for(const l of S.ledger){if(l.date>upto)continue;if(CASH_IN[l.type]&&l.to===k)c+=l.amount;else if(CASH_OUT[l.type]&&l.from===k)c-=l.amount}return r2(c)}
function coFlowHTML(ym,b,m){
  const[y,mo]=ym.split('-').map(Number),ms=iso(y,mo,1),me=iso(y,mo,dim(y,mo)),cur=ym>=ymOf(AS_OF),asAt=me<AS_OF?me:AS_OF;
  const inM=l=>l.date>=ms&&l.date<=me;
  const rows=S.companies.map(c=>{const id='co:'+c.id,L2=S.ledger.filter(inM);
    const g=(t,side)=>r2(sum(L2.filter(l=>l.type===t&&l[side]===id),l=>l.amount));
    const fromPool=g('allocation','to'),repP=g('repayment_principal','to'),repF=r2(g('repayment_profit','to')+g('other_charge','to'));
    const disb=g('disbursement','from'),recall=g('recall','from'),cofPosted=g('cof_transfer','from');
    const mc=m.cos.find(x=>x.c.id===c.id),cofDue=!mc.posted&&mc.cof>0?mc.cof:0;
    const toCollect=cur?r2(sum(S.cases.filter(k=>k.companyId===c.id),k=>sum(k.rows.filter(r=>ymOf(r.due)===ym),owe))+sum(S.invoices.filter(i=>i.companyId===c.id&&i.status==='funded'&&ymOf(i.debtorDue)===ym),i=>i.advanced+i.advanced*S.settings.factorFee/100)):0;
    const tin=r2(fromPool+repP+repF),tout=r2(disb+cofPosted+recall);
    return{c,fromPool,repP,repF,disb,recall,cofPosted,cofDue,toCollect,tin,tout,net:r2(tin-tout),cash:coCash(c.id,asAt)}});
  const T=k=>r2(sum(rows,r=>r[k])),mx=Math.max(1,...rows.map(r=>Math.max(r.tin,r.tout)));

    '<tr><th class="r">From pool</th><th class="r">Repayment · principal</th><th class="r">Repayment · profit</th><th class="r">Disbursed</th><th class="r">COF to pool</th><th class="r">Back to pool</th><th class="r">Total out</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.c.name)+'<div class="small">'+esc(coDesc(r.c))+'</div></td><td class="r num">'+n(r.fromPool)+'</td><td class="r num">'+n(r.repP)+'</td><td class="r num">'+n(r.repF)+'</td>'+
      '<td class="r num">'+n(r.disb)+'</td><td class="r num">'+(r.cofPosted?fmt(r.cofPosted):r.cofDue?'<span class="small">'+fmt(r.cofDue)+' due</span>':'—')+'</td><td class="r num">'+n(r.recall)+'</td><td class="r num">'+n(r.tout)+'</td>'+
      '<td class="r num" style="font-weight:600;color:'+(r.net<0?'var(--orange-ink)':r.net>0?'var(--good)':'inherit')+'">'+(r.net>0?'+':'')+(r.net?fmt(r.net):'—')+'</td>'+
      '<td style="min-width:110px"><div style="display:grid;gap:3px" title="In vs out"><div class="bar full" style="height:6px"><i style="width:'+(r.tin/mx*100).toFixed(1)+'%;background:var(--good)"></i></div><div class="bar full" style="height:6px"><i class="hot" style="width:'+(r.tout/mx*100).toFixed(1)+'%"></i></div></div></td>'+

function ocrMatch(o){
  const ref=String(o.ref||'').trim().toUpperCase().replace(/\s+/g,' ');
  const dup=ref?S.payments.find(p=>p.ref.toUpperCase().replace(/\s+/g,' ')===ref):null;
  const pn=norm(o.payer);let cu=null;
  if(pn.length>=3)cu=S.customers.find(c=>{const n=norm(c.name);return n&&(n.includes(pn)||pn.includes(n))});
  let k=null,row=null;
  if(cu){const open=S.cases.filter(x=>x.customerId===cu.id&&caseInfo(x).unpaid.length);
    for(const x of open){const r=caseInfo(x).unpaid[0];if(Math.abs(owe(r)-num(o.amount))<0.01){k=x;row=r;break}}
    if(!k&&open.length){k=open.find(x=>x.id===o.caseId)||open[0];row=caseInfo(k).unpaid[0]}}
  return{dup,cu,k,row};
}

    if(m.dup){match+='<br>'+chip('Duplicate slip','bad')+' Reference already posted on '+fd(m.dup.date)+' ('+m.dup.caseId+', RM '+fmt(m.dup.amount)+')';cls='bad';post=false}

  }

function acctData(cu){

  S.cases.filter(k=>k.customerId===cu.id).forEach(k=>{const i=caseInfo(k);
    items.push({kind:'case',id:k.id,ref:k.ref,product:'CapBoost',co:k.companyId,date:k.start,issued:k.amount,out:i.status==='Settled'?0:i.principalOut,bal:i.balance,
      next:i.next&&i.status!=='Settled'?i.next.due:null,nextAmt:i.next?owe(i.next):0,overdue:i.overdue,dpd:i.dpd,ongoing:i.status!=='Settled',status:k.settlement?'Settled early':i.status,terms:k.rate+'% / mth · '+k.tenure+' m'})});
  S.invoices.filter(v=>v.clientId===cu.id&&v.fundedOn).forEach(v=>{const live=v.status==='funded',od=live&&v.debtorDue<AS_OF;
    items.push({kind:'inv',id:v.id,ref:v.no,product:'Capbridge-i',co:v.companyId,date:v.fundedOn,issued:v.advanced,out:live?v.advanced:0,bal:live?v.advanced:0,

  items.sort((a,b)=>(b.ongoing-a.ongoing)||(a.date<b.date?1:-1));
  const on=items.filter(x=>x.ongoing);
  return{cu,items,on,issued:r2(sum(items,x=>x.issued)),issuedOn:r2(sum(on,x=>x.issued)),out:r2(sum(on,x=>x.out)),bal:r2(sum(on,x=>x.bal)),overdue:r2(sum(items,x=>x.overdue)),

function applyPayment(k,amount,date,ref,source){
  let rem=r2(amount),pTot=0,fTot=0;const touched=[];
  for(const r of k.rows){if(rem<=0.004)break;if(owe(r)<=0.004)continue;
    const f=Math.min(rem,r2(r.profit-(r.recF||0)));r.recF=r2((r.recF||0)+f);rem=r2(rem-f);fTot+=f;
    const p=Math.min(rem,r2(r.principal-(r.recP||0)));r.recP=r2((r.recP||0)+p);rem=r2(rem-p);pTot+=p;
    r.date=date;touched.push(r.n);}
  const c='co:'+k.companyId;
  if(fTot>0)L(date,'repayment_profit','case:'+k.id,c,fTot,ref,k.ref+' #'+touched.join(',')+' profit');
  if(pTot>0)L(date,'repayment_principal','case:'+k.id,c,pTot,ref,k.ref+' #'+touched.join(',')+' principal');
  S.payments.push({id:'p'+S.seq++,caseId:k.id,rows:touched,amount:r2(amount-rem),date,ref,source,confirmedBy:'Chloe'});
  return{touched,excess:rem};
}
function settleCalc(k,date){const ym=ymOf(date),un=k.rows.filter(r=>owe(r)>0.004);
  const cur=k.rows.find(r=>ymOf(r.due)===ym);
  return{ym,cur,pOut:r2(sum(k.rows,r=>r.principal-(r.recP||0))),
    overdueF:r2(sum(un.filter(r=>ymOf(r.due)<ym),r=>r.profit-(r.recF||0))),
    monthF:cur?r2(Math.max(0,cur.profit-(cur.recF||0))):r2(k.amount*k.rate/100),
    futureF:r2(sum(un.filter(r=>ymOf(r.due)>ym),r=>r.profit-(r.recF||0)))}}
const stItems=fm=>[...fm.querySelectorAll('#st_items > [data-n]')].map(el=>{const n=el.dataset.n;return{label:fm['it_l_'+n].value.trim(),sign:+fm['it_s_'+n].value,amt:r2(num(fm['it_a_'+n].value))}}).filter(i=>i.amt>0||i.label);
function applySettlement(k,date,ref,o){
  const c=settleCalc(k,date),cc='co:'+k.companyId;
  const pCol=r2(Math.min(o.principal,c.pOut)),writeoff=r2(c.pOut-pCol);
  let left=r2(Math.max(0,o.profit-o.deduct)),waived=0;
  for(const r of k.rows){if(owe(r)<=0.004)continue;
    r.recP=r.principal;const fr=r2(r.profit-(r.recF||0)),t=Math.min(left,fr);
    r.recF=r2((r.recF||0)+t);left=r2(left-t);r.waived=r2(r.profit-r.recF);waived+=r.waived;r.date=date}
  const profitCol=r2(Math.max(0,o.profit-o.deduct)-left),charges=r2(o.charges+left);
  if(profitCol>0)L(date,'repayment_profit','case:'+k.id,cc,profitCol,ref,k.ref+' early settlement · profit');
  if(pCol>0)L(date,'repayment_principal','case:'+k.id,cc,pCol,ref,k.ref+' early settlement · principal');
  if(writeoff>0)L(date,'principal_writeoff','case:'+k.id,cc,writeoff,ref,k.ref+' principal written off at settlement');
  if(charges>0)L(date,'other_charge','case:'+k.id,cc,charges,ref,k.ref+' settlement charges: '+o.items.filter(i=>i.sign>0).map(i=>i.label).join(', '));
  const total=r2(pCol+profitCol+charges);
  S.payments.push({id:'p'+S.seq++,caseId:k.id,rows:[],amount:total,date,ref,source:'Early settlement',confirmedBy:'Chloe'});
  k.settlement={date,ref,principal:pCol,writeoff,profit:profitCol,charges,deduct:o.deduct,items:o.items,waived:r2(waived),total};return k.settlement}
function setRow(k,r,amount,date){

  const dF=r2(nf-(r.recF||0)),dP=r2(np-(r.recP||0)),c='co:'+k.companyId;

  if(dP)L(date||AS_OF,'repayment_principal','case:'+k.id,c,dP,'EDIT',k.ref+' #'+r.n+' principal (manual edit)');

}

function parsePaste(t){
  const F={},C={};
  const lab=keys=>{const m=t.match(new RegExp('^[\\s*•\\-]*(?:'+keys+')\\s*[:：=\\-]\\s*(.+)$','im'));return m?m[1].trim():''};
  let v,m;
  if(v=lab('company name|company|syarikat|nama syarikat|business name')){F.name=v;C.name=99}
  else if(m=t.match(/([A-Z][\w&.'\- ]{2,60}?\s(?:Sdn\.?\s?Bhd\.?|Berhad|Bhd|Enterprise|PLT))/)){F.name=m[1].trim();C.name=80}
  if(v=lab('ssm no\\.?|ssm|reg(?:istration)? no\\.?|roc|company no\\.?')){F.ssm=v.replace(/\s/g,'');C.ssm=97}
  else if(m=t.match(/\b((?:19|20)\d{10})\b/)){F.ssm=m[1];C.ssm=75}
  if(v=lab('ic no\\.?|ic|nric|mykad|no\\.? kp')){F.ic=v;C.ic=98}
  else if(m=t.match(/\b(\d{6}-\d{2}-\d{4})\b/)){F.ic=m[1];C.ic=90}
  if(v=lab('h/p|hp|tel|phone|mobile|no\\.? tel|contact no\\.?')){F.phone=v;C.phone=99}
  else if(m=t.match(/(?:\+?60|0)1\d[\s-]?\d{3,4}[\s-]?\d{4}/)){F.phone=m[0];C.phone=85}
  if(m=t.match(/[\w.+-]+@[\w-]+\.[\w.]+/)){F.email=m[0];C.email=99}
  if(v=lab('director|pengarah|contact person|pic|owner')){F.director=v;C.director=96}
  if(v=lab('address|alamat')){F.address=v;C.address=72}
  if(v=lab('nature of business|business|industry|perniagaan|sector')){F.industry=v.charAt(0).toUpperCase()+v.slice(1);C.industry=90}
  if((v=lab('amount applied|amount requested|financing amount|loan amount|amount|jumlah'))&&(m=v.match(/(\d[\d,]*(?:\.\d+)?)\s*(k|mil|million|juta|m)?\b/i))){let a=num(m[1]);const u=(m[2]||'').toLowerCase();if(u==='k')a*=1e3;else if(u)a*=1e6;F.amount=String(a);C.amount=97}
  else if(m=t.match(/(?:need|perlu|request(?:ed)?|amount|financing|loan|pinjaman)\D{0,20}?(?:rm\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k|mil|million|juta|m)?\b/i)||t.match(/rm\s*(\d[\d,]*(?:\.\d+)?)\s*(k|mil|million|juta|m)?\b/i)){
    let a=num(m[1]);const u=(m[2]||'').toLowerCase();if(u==='k')a*=1e3;else if(u)a*=1e6;F.amount=String(a);C.amount=94}
  if(m=t.match(/(\d{1,2})\s*(?:months?|mths?|bulan)\b/i)){F.tenure=m[1];C.tenure=92}
  else if(m=t.match(/(\d)\s*(?:years?|tahun)\b/i)){F.tenure=String(m[1]*12);C.tenure=85}
  v=lab('facility applied|type of facility|facility|product|kemudahan');const pv=(v||t).toLowerCase();
  if(/capbridge|factoring|invoice financing/.test(pv)){F.product='factoring';C.product=v?97:70}else if(/capboost/.test(pv)){F.product='capboost';C.product=v?97:70}
  v=lab('financier|lender|apply to|applied to|company applied to|pembiaya');
  if(v){const c=S.companies.find(c=>norm(v).includes(norm(c.name).split(' ')[0])||norm(c.name).includes(norm(v)));if(c){F.company=c.id;C.company=96}}
  if(v=lab('purpose|tujuan')){F.purpose=v;C.purpose=93}
  return{F,C};
}

  acctAll:d=>{document.querySelectorAll('details.acct').forEach(el=>{el.open=d.open==='1';ui.aOpen[el.dataset.cu]=el.open})},
  repayCase:d=>{const k=S.cases.find(x=>x.id===d.k),i=caseInfo(k),def=i.overdue>0?i.overdue:(i.next?owe(i.next):0);
    openModal('Repayment · '+k.ref,'<div class="form-grid">'+field('rp_amt','Amount received (RM)',inp('rp_amt',def,'number','min="0" step="0.01"'))+field('rp_date','Date received',inp('rp_date',AS_OF,'date'))+
      field('rp_ref','Reference (cheque / transfer no.)',inp('rp_ref','','text','placeholder="e.g. CHQ 004600"'))+field('rp_m','Method','<select class="in" id="rp_m" name="rp_m">'+['Bank transfer','DuitNow','Cheque','Cash'].map(x=>opt(x,x)).join('')+'</select>')+'</div><div class="prev" id="rp_prev"></div>',
      x=>{const a=r2(num(x.rp_amt));if(a<=0)return 'Enter the amount received.';const ref=x.rp_ref.trim();
        if(ref&&S.payments.some(p=>p.ref.toUpperCase().replace(/\s+/g,' ')===ref.toUpperCase().replace(/\s+/g,' ')))return 'Reference '+ref+' was already posted — possible duplicate slip.';
        const res=applyPayment(k,a,x.rp_date||AS_OF,ref||('MANUAL '+(x.rp_date||AS_OF)),x.rp_m);
        toast('Posted '+rm(a)+' to '+k.ref+(res.touched.length?' #'+res.touched.join(', #'):'')+(res.excess>0?' · '+rm(res.excess)+' excess held as credit':''))},'Post repayment',
      fm=>{let rem=num(fm.rp_amt.value);const lines=[];
        for(const r of k.rows){if(rem<=0.004)break;const o=owe(r);if(o<=0.004)continue;const t=Math.min(rem,o);lines.push('#'+r.n+' · '+fds(r.due)+' · '+(t<o-0.004?'part '+fmt(t)+' of '+fmt(o):fmt(t)));rem=r2(rem-t)}
        document.getElementById('rp_prev').innerHTML='<div><span>Applies to</span><b style="text-align:right">'+(lines.join('<br>')||'—')+'</b></div>'+(rem>0.004?'<div><span>Excess (held as credit)</span><b class="num">'+rm(rem)+'</b></div>':'')+'<div><span>Split</span><span>Profit first, then principal</span></div>'})},
  cbMonth:d=>{const cos=scopeCos(d.scope,'capboost');openView('CapBoost · '+ymLabel(d.ym)+' · '+esc(d.scope==='all'?'All companies':cos[0].name),cbMonthHTML(d.ym,d.scope))},
  fMonth:d=>{const cos=scopeCos(d.scope,'factoring');openView('Capbridge-i · '+ymLabel(d.ym)+' · '+esc(d.scope==='all'?'All companies':cos[0].name),fMonthHTML(d.ym,d.scope))},
  cbList:d=>{const cos=scopeCos(d.scope,'capboost'),t=d.scope==='all'?'All companies':cos[0].name;openView((d.kind==='od'?'Overdue CapBoost cases':'All CapBoost cases issued')+' · '+esc(t),cbListHTML(d.kind,d.scope))},
  settleCase:d=>{const k=S.cases.find(x=>x.id===d.k),c0=settleCalc(k,AS_OF);
    const line=(id,label,val,hint)=>'<div class="sline"><label for="'+id+'"><span>'+label+'</span>'+(hint?'<span class="small">'+hint+'</span>':'')+'</label><input class="in" style="text-align:right" type="number" step="0.01" min="0" id="'+id+'" name="'+id+'" value="'+val+'"></div>';
    openModal('Early settlement · '+k.ref,'<div class="form-grid">'+field('st_date','Settlement date',inp('st_date',AS_OF,'date'))+field('st_ref','Reference (cheque / transfer no.)',inp('st_ref',''))+'</div>'+
      '<div class="prev" style="gap:2px">'+line('st_p','Outstanding principal',c0.pOut,'<span id="st_p_h">Outstanding RM '+fmt(c0.pOut)+'</span>')+
      line('st_m','Profit for this month','',k.rate+'% × RM '+fmt(k.amount)+' · <span id="st_m_h"></span>')+
      line('st_o','Overdue profit, past months',c0.overdueF,'Unpaid profit on earlier instalments')+
      '<datalist id="st_presets"><option value="Late payment charge (ta’widh)"><option value="Legal / stamping fee"><option value="Rebate (ibra’)"><option value="Discount"><option value="Admin fee"></datalist>'+
      '<div id="st_items" style="display:grid;gap:6px;margin-top:6px"></div>'+
      '<div><button type="button" class="btn sm" data-act="stAddItem">+ Add item</button></div>'+
      '<div id="st_tot" style="display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px;margin-top:6px"></div></div>'+
      '<p class="hint" style="margin:0">Pre-filled: outstanding principal + this month’s profit at the case rate + overdue profit. Change any amount, or add charges / deductions. Profit not collected is waived.</p>',
      (x,fm)=>{const date=x.st_date||AS_OF,ref=x.st_ref.trim()||('SETTLE '+k.ref),c=settleCalc(k,date);
        if(x.st_ref.trim()&&S.payments.some(p=>p.ref.toUpperCase()===ref.toUpperCase()))return 'Reference '+ref+' was already posted — possible duplicate slip.';
        const pr=num(x.st_p);if(pr>c.pOut+0.004)return 'Principal can’t be more than the outstanding RM '+fmt(c.pOut)+'. Add the extra as an item.';
        const items=stItems(fm);if(items.some(i=>i.amt>0&&!i.label))return 'Give each added item a name.';
        const plus=r2(sum(items.filter(i=>i.sign>0),i=>i.amt)),minus=r2(sum(items.filter(i=>i.sign<0),i=>i.amt)),profit=r2(num(x.st_m)+num(x.st_o));
        if(minus>profit+plus+0.004)return 'Deductions are more than the profit and charges. Lower the principal instead.';
        const r=applySettlement(k,date,ref,{principal:pr,profit,deduct:Math.min(minus,profit),charges:r2(plus-Math.max(0,minus-profit)),items});
        toast(k.ref+' settled · '+rm(r.total)+' received'+(r.writeoff>0?' · '+rm(r.writeoff)+' written off':'')+' · '+rm(r.waived)+' profit waived')},'Confirm settlement',
      (fm,e)=>{const t=e&&e.target,date=fm.st_date.value||AS_OF,c=settleCalc(k,date);
        if(!e||t.id==='st_date'){fm.st_p.value=c.pOut;fm.st_m.value=c.monthF;fm.st_o.value=c.overdueF;
          document.getElementById('st_p_h').textContent='Outstanding RM '+fmt(c.pOut);
          document.getElementById('st_m_h').textContent=ymLabel(c.ym)+(c.cur&&c.monthF===0?' · already paid':'')}
        const items=stItems(fm),plus=r2(sum(items.filter(i=>i.sign>0),i=>i.amt)),minus=r2(sum(items.filter(i=>i.sign<0),i=>i.amt));
        const pr=num(fm.st_p.value),tot=r2(pr+num(fm.st_m.value)+num(fm.st_o.value)+plus-minus),wo=r2(c.pOut-pr);
        document.getElementById('st_tot').innerHTML=(plus?'<div style="display:flex;justify-content:space-between"><span>Added items</span><b class="num">+'+rm(plus)+'</b></div>':'')+
          (minus?'<div style="display:flex;justify-content:space-between"><span>Deducted items</span><b class="num">−'+rm(minus)+'</b></div>':'')+
          '<div style="display:flex;justify-content:space-between;align-items:baseline"><b>Settlement amount</b><b class="num" style="font-size:17px">'+rm(tot)+'</b></div>'+
          (wo>0.004?'<div style="display:flex;justify-content:space-between;color:var(--bad)"><span>Principal written off</span><b class="num">'+rm(wo)+'</b></div>':wo<-0.004?'<div style="color:var(--bad)">Principal is more than outstanding — add the extra as an item.</div>':'')})},
  stAddItem:()=>{const box=document.getElementById('st_items'),n=box.children.length?1+Math.max(...[...box.children].map(x=>+x.dataset.n)):0;
    box.insertAdjacentHTML('beforeend','<div class="stitem" data-n="'+n+'">'+
      '<input class="in" list="st_presets" id="it_l_'+n+'" name="it_l_'+n+'" placeholder="Item, e.g. Rebate (ibra’)" aria-label="Item name">'+
      '<select class="in" id="it_s_'+n+'" name="it_s_'+n+'" aria-label="Add or deduct"><option value="1">+ Add</option><option value="-1">− Deduct</option></select>'+
      '<input class="in" style="text-align:right" type="number" min="0" step="0.01" id="it_a_'+n+'" name="it_a_'+n+'" placeholder="0.00" aria-label="Item amount">'+
      '<button type="button" class="btn sm" data-act="stDelItem" data-n="'+n+'" aria-label="Remove item">×</button></div>');
    document.getElementById('it_l_'+n).focus()},
  stDelItem:d=>{const el=document.querySelector('#st_items > [data-n="'+d.n+'"]');if(el)el.remove();MODAL.onInput(document.getElementById('mf'))},
  editRow:d=>{const k=S.cases.find(x=>x.id===d.k),r=k.rows.find(x=>x.n==d.n);openModal(k.ref+' · Instalment #'+r.n,'<div class="prev"><div><span>Due '+fd(r.due)+'</span><b class="num">'+rm(inst(r))+'</b></div><div><span>Principal / profit</span><b class="num">'+fmt(r.principal)+' / '+fmt(r.profit)+'</b></div></div><div class="form-grid">'+
    field('m_a','Amount received (RM)',inp('m_a',recd(r)||'','number','min="0" step="0.01"'))+field('m_d','Date received',inp('m_d',r.date||AS_OF,'date'))+'</div><p class="hint" style="margin:0">Applied profit first, then principal. Changes post adjustment rows to the ledger.</p>',
    x=>{const a=num(x.m_a);if(a<0)return 'Amount can’t be negative.';if(a>inst(r)+0.004)return 'More than this instalment ('+rm(inst(r))+'). Use Record payment to spread an over payment.';setRow(k,r,r2(a),x.m_d);toast('Instalment #'+r.n+' updated')},'Save')},
  ocrSample:d=>{const k=S.cases.find(x=>x.id===d.k),cu=custById(d.cu),i=caseInfo(k),r=i.unpaid[0];
    ui.ocr={cust:cu.id,caseId:k.id,file:'slip_'+AS_OF.slice(8)+MON[D(AS_OF).m-1].toLowerCase()+'.jpg',img:null,payer:cu.name.toUpperCase(),amount:r?String(owe(r)):'0',date:AS_OF,ref:'CHQ 004512',conf:{payer:98,amount:99,date:95,ref:71}};render()},
  ocrClear:()=>{ui.ocr=null;render()},
  ocrPost:()=>{const o=ui.ocr,m=ocrMatch(o);if(!m.k||m.dup)return;const amt=r2(num(o.amount));
    const res=applyPayment(m.k,amt,o.date||AS_OF,String(o.ref).trim(),'OCR · '+o.file);ui.tab[m.cu.id]=m.k.id;ui.ocr=null;save();
    if(route()!=='customer-'+m.cu.id)location.hash='customer-'+m.cu.id;else render();
    toast('Posted '+rm(amt)+' to '+m.k.ref+' #'+res.touched.join(', #')+(res.excess>0?' · '+rm(res.excess)+' excess held as credit':''))},
  detect:()=>{const t=document.getElementById('paste').value;const{F,C}=parsePaste(t);ui.nc={...ui.nc,text:t,F:{...F,product:F.product||ui.nc.F.product||'',company:F.company||ui.nc.F.company||'',owner:ui.nc.F.owner||'Chloe'},C,detected:true,form:null};render()},
  appSample:()=>readForm(),
  appClear:()=>{ui.nc=null;render()},
  pasteSample:()=>{const c=S.customers[0];ui.nc={text:'Fwd from WhatsApp\nCompany: '+c.name+'\nSSM: '+c.ssm+'\nDirector: '+c.director+'\nHP: '+c.phone+'\nNeed RM150,000 for 6 months',F:{},C:{},detected:false,file:''};render()},
  saveCust:d=>{const n=ui.nc,F=n.F,err=document.getElementById('ncerr');
    if(!F.name||!(F.ssm||F.ic)){err.textContent='Company name and SSM or IC are required.';return}
    const dup=findDup(F);if(dup){err.innerHTML='A customer with this SSM / IC already exists: <a href="#customer-'+dup.id+'">'+esc(dup.name)+'</a>. Open it instead of creating a duplicate.';return}
    const addr=F.address||'',parts=addr.split(',').map(s=>s.trim()).filter(Boolean);
    const cu={id:'c'+S.seq++,name:F.name,ssm:F.ssm||'',industry:F.industry||'',address:addr,location:parts.length>1?parts[parts.length-2]:(parts[0]||''),director:F.director||'',ic:F.ic||'',phone:F.phone||'',email:F.email||'',docs:n.form?[n.form.file]:[]};
    S.customers.push(cu);save();ui.nc=null;toast(cu.name+' saved');
    if(d.case){location.hash='customer-'+cu.id;setTimeout(()=>{if(F.product==='factoring')newInvModal(false,{co:F.company,cl:cu.id});else newCaseModal({cu:cu.id,co:F.company,amount:num(F.amount)||100000,tenure:num(F.tenure)||12,purpose:F.purpose||''})},200)}
    else location.hash='customer-'+cu.id},
  editCust:d=>{const c=custById(d.id);const k=['name','ssm','industry','location','address','director','ic','phone','email'],lb={name:'Company name',ssm:'SSM no.',industry:'Industry',location:'Location',address:'Address',director:'Director',ic:'IC no.',phone:'Phone',email:'Email'};
    openModal('Edit customer','<div class="form-grid">'+k.map(x=>field('e_'+x,lb[x],inp('e_'+x,c[x]))).join('')+'</div>',x=>{if(!x.e_name.trim())return 'Company name is required.';k.forEach(y=>c[y]=x['e_'+y].trim());toast('Customer updated')},'Save')},
  newCase:d=>newCaseModal({cu:d.cu||S.customers[0].id,co:d.co}),
  newInv:d=>newInvModal(!!d.ocr,{co:d.co,cl:d.cl}),
  addCo:()=>openModal('Add company','<div class="form-grid">'+field('a_name','Company name',inp('a_name',''))+field('a_short','Short code (2–3 letters)',inp('a_short',''))+'</div>'+
    '<div class="f"><span class="small">Products offered</span><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="a_cb" id="a_cb"> CapBoost</label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="a_fa" id="a_fa"> Capbridge-i</label></div>'+
    '<div class="form-grid">'+field('a_pu','Purpose (if no products)',inp('a_pu','Expenses / parking only'))+field('a_cof','COF % p.a.',inp('a_cof',11.5,'number','step="0.01"'))+'</div>',
    x=>{const nm=x.a_name.trim();if(!nm)return 'Enter the company name.';if(S.companies.some(c=>c.name.toLowerCase()===nm.toLowerCase()))return nm+' already exists.';
      const sc=(x.a_short.trim()||nm.split(/\s+/).map(w=>w[0]).join('').slice(0,3)).toUpperCase();
      const products=[x.a_cb?'capboost':null,x.a_fa?'factoring':null].filter(Boolean);
      S.companies.push({id:'co'+S.seq++,name:nm,short:sc,products,purpose:products.length?'':x.a_pu.trim(),cofRate:num(x.a_cof),threshold:80,prefix:sc});toast(nm+' added')},'Add company'),
  invVerify:d=>{const i=S.invoices.find(x=>x.id===d.i);i.status='verified';save();render();toast(i.no+' · debtor verified')},
  invFund:d=>{const i=S.invoices.find(x=>x.id===d.i),b=balances();if(i.advanced>b.avail(i.companyId)){toast(coById(i.companyId).name+' has only '+rm(b.avail(i.companyId))+' available — allocate more first');return}
    if(debtorConc().some(x=>x.debtor===i.debtor&&x.over))toast('Note: '+i.debtor+' is already over the debtor limit');
    i.status='funded';i.fundedOn=AS_OF;L(AS_OF,'disbursement','co:'+i.companyId,'inv:'+i.no,i.advanced,i.no,'Advance to client');save();render();toast(i.no+' funded · '+rm(i.advanced)+' advanced')},
  invCollect:d=>{const i=S.invoices.find(x=>x.id===d.i),mths=Math.max(1,Math.ceil(days(i.fundedOn,AS_OF)/30));
    i.fee=r2(i.advanced*S.settings.factorFee/100*mths);i.rebate=r2(i.amount-i.advanced-i.fee);i.status='collected';i.collectedOn=AS_OF;
    L(AS_OF,'repayment_principal','inv:'+i.no,'co:'+i.companyId,i.advanced,i.no,'Debtor paid · advance back');L(AS_OF,'repayment_profit','inv:'+i.no,'co:'+i.companyId,i.fee,i.no,'Fee (ujrah) '+mths+' mth');
    L(AS_OF,'rebate_to_client','co:'+i.companyId,'cust:'+i.clientId,i.rebate,i.no,'Balance / rebate to client');save();render();toast(i.no+' collected · fee '+rm(i.fee)+' · rebate '+rm(i.rebate))}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(!a)return;
  if(el.tagName==='BUTTON'&&el.type!=='submit')e.preventDefault();a(el.dataset,el,e)});
document.addEventListener('toggle',e=>{const el=e.target;if(el.classList&&el.classList.contains('acct'))ui.aOpen[el.dataset.cu]=el.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL)closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.ui==='aq'){ui.aq=t.value;const l=document.getElementById('acct_list');if(l)l.innerHTML=acctListHTML()}
  if(t.dataset.ui==='q'){ui.q=t.value;const tb=document.getElementById('ctb');if(tb)tb.innerHTML=custRowsHTML(ui.co)}
  if(t.dataset.nc&&ui.nc&&t.dataset.nc!=='file'){if(t.dataset.nc==='text')ui.nc.text=t.value;else ui.nc.F[t.dataset.nc]=t.value}
  if(t.dataset.ocr&&t.dataset.ocr!=='file'&&ui.ocr){ui.ocr[t.dataset.ocr]=t.value}});
document.addEventListener('change',e=>{const t=e.target,u=t.dataset.ui;
  if(u==='st'||u==='sort'||u==='lt'||u==='cbYear'||u==='fYear'||u==='aShow'||u==='aSort'){ui[u]=t.value;render()}
  else if(u==='month'){ui.month=t.value;render()}
  else if(u==='cosw'){location.hash='customers-'+t.value}
  else if(u==='psw'){location.hash=t.dataset.p+'-'+t.value}
  else if(t.dataset.nc==='product'&&ui.nc){ui.nc.F.product=t.value;if(ui.nc.F.company&&!offers(coById(ui.nc.F.company),t.value))ui.nc.F.company='';render()}
  else if(t.dataset.nc==='file'&&t.files[0]){ui.nc.file=t.files[0].name;render()}
  else if(t.dataset.nc==='appform'&&t.files[0]){readForm(t.files[0].name)}
  else if(t.dataset.ocr==='file'&&t.files[0]){const fl=t.files[0],r=location.hash.slice(10),cu=custById(route().slice(9));if(!cu)return;
    const tab=ui.tab[cu.id]||(S.cases.find(k=>k.customerId===cu.id&&caseInfo(k).unpaid.length)||{}).id;const k=S.cases.find(x=>x.id===tab);if(!k)return;
    ACT.ocrSample({cu:cu.id,k:k.id});ui.ocr.file=fl.name;
    if(fl.type.startsWith('image/')){const rd=new FileReader();rd.onload=()=>{if(ui.ocr){ui.ocr.img=rd.result;render()}};rd.readAsDataURL(fl)}else render()}
  else if(t.dataset.ocr&&ui.ocr){ui.ocr[t.dataset.ocr]=t.value;render()}});

render();
</script>

</body></html>
